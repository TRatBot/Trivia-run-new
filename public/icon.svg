<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3a2714" />
      <stop offset="100%" stop-color="#1b140d" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="jade" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.55" />

  <!-- Sunburst Rays -->
  <g transform="translate(256 256)" stroke="#facc15" stroke-linecap="round">
    <line x1="0" y1="-152" x2="0" y2="-206" stroke-width="18" />
    <line x1="0" y1="-152" x2="0" y2="-188" stroke-width="12" transform="rotate(30)" />
    <line x1="0" y1="-152" x2="0" y2="-206" stroke-width="18" transform="rotate(60)" />
    <line x1="0" y1="-152" x2="0" y2="-188" stroke-width="12" transform="rotate(90)" />
    <line x1="0" y1="-152" x2="0" y2="-206" stroke-width="18" transform="rotate(120)" />
    <line x1="0" y1="-152" x2="0" y2="-188" stroke-width="12" transform="rotate(150)" />
    <line x1="0" y1="-152" x2="0" y2="-206" stroke-width="18" transform="rotate(180)" />
    <line x1="0" y1="-152" x2="0" y2="-188" stroke-width="12" transform="rotate(210)" />
    <line x1="0" y1="-152" x2="0" y2="-206" stroke-width="18" transform="rotate(240)" />
    <line x1="0" y1="-152" x2="0" y2="-188" stroke-width="12" transform="rotate(270)" />
    <line x1="0" y1="-152" x2="0" y2="-206" stroke-width="18" transform="rotate(300)" />
    <line x1="0" y1="-152" x2="0" y2="-188" stroke-width="12" transform="rotate(330)" />
  </g>

  <!-- Carved Sun Medallion Ring -->
  <circle cx="256" cy="256" r="134" fill="#1e150e" stroke="url(#gold)" stroke-width="18" />
  <circle cx="256" cy="256" r="96" fill="url(#jade)" stroke="#fde047" stroke-width="10" />

  <!-- Temple Sun Star Core -->
  <polygon
    points="256,184 276,236 328,256 276,276 256,328 236,276 184,256 236,236"
    fill="#fef08a"
    stroke="#1e150e"
    stroke-width="6"
    stroke-linejoin="round"
  />
  <circle cx="256" cy="256" r="18" fill="#eab308" stroke="#1e150e" stroke-width="5" />
</svg>
